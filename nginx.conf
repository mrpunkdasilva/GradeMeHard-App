server {
    listen 80;
    server_name localhost;

    # Root directory where the Flutter web app is located
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # This is the magic for single-page applications (SPAs) like Flutter web.
        # It tries to find the requested file, then a directory, and if neither exists,
        # it falls back to serving /index.html. This allows Flutter's router to handle all paths.
        try_files $uri $uri/ /index.html;
    }

    # Optional: Improve caching for static assets
    location ~* \.(?:css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public";
    }
}
